{% extends "base.html" %}

{% block content %}
<section class="section container narrow">
    <a class="text-link" href="{{ url_for('films') }}">← До списку фільмів</a>
    <h1>{{ page_title }}</h1>

    {% if errors %}
    <div class="alert alert-error" role="alert">
        <strong>Перевірте введені дані:</strong>
        <ul>
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <div id="submit-error" class="alert alert-error" role="alert" hidden></div>

    <form id="film-form" class="product-form" method="post" action="{{ action_url }}">
        <label>
            Назва
            <input
                type="text"
                name="title"
                value="{{ values.title }}"
                minlength="2"
                maxlength="120"
                required
            >
        </label>

        <label>
            Продюсер
            <input
                type="text"
                name="producer"
                value="{{ values.producer }}"
                maxlength="20"
                required
            >
        </label>

        <label>
            Жанр
            <input
                type="text"
                name="genre"
                value="{{ values.genre }}"
                maxlength="20"
                required
            >
        </label>

        <label>
            Тривалість
            <input
                type="number"
                name="duration"
                value="{{ values.duration }}"
                required
            >
        </label>

        <label>
            Рік
            <input
                type="number"
                name="year"
                value="{{ values.year }}"
                min="1900"
                max="2026"
                required
            >
        </label>

        <label>
            Актори через кому
            <input
                type="text"
                name="actors"
                value="{{ values.actors }}"
            >
        </label>

        <button class="button" type="submit">{{ submit_label }}</button>
    </form>
</section>
