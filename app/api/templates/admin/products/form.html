{% extends "base.html" %}

{% block content %}
<section class="section container narrow">
    <a class="text-link" href="{{ url_for('admin_products') }}">← До списку продуктів</a>
    <h1>{{ page_title }}</h1>

    {% if errors %}
    <div class="alert alert-error" role="alert">
        <strong>Перевірте введені дані:</strong>
        <ul>
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <form class="product-form" method="post" action="{{ action_url }}">
        <label>
            Назва
            <input
                type="text"
                name="name"
                value="{{ values.name }}"
                minlength="2"
                maxlength="120"
                required
            >
        </label>

        <label>
            SKU
            <input
                type="text"
                name="sku"
                value="{{ values.sku }}"
                pattern="[A-Za-z0-9-]{4,20}"
                maxlength="20"
                required
            >
        </label>

        <label>
            Ціна
            <input
                type="number"
                name="price"
                value="{{ values.price }}"
                min="0.01"
                max="1000000"
                step="0.01"
                required
            >
        </label>

        <label>
            Категорія
            <select name="category" required>
                {% for category in categories %}
                <option
                    value="{{ category.value }}"
                    {% if values.category == category.value %}selected{% endif %}
                >
                    {{ category.value }}
                </option>
                {% endfor %}
            </select>
        </label>

        <label>
            Теги через кому
            <input
                type="text"
                name="tags"
                value="{{ values.tags }}"
                placeholder="chair, furniture"
            >
        </label>

        <button class="button" type="submit">{{ submit_label }}</button>
    </form>
</section>
{% endblock %}
